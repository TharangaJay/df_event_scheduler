name: Weekly DF schedule

on:
  schedule:
    - cron: "0 10 * * 3"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      mode:
        description: "What should this manual run do?"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - test-email
          - live-schedule

permissions:
  contents: write

concurrency:
  group: df-weekly-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Run scheduler
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          DF_NOTIFICATION_EMAILS: ${{ secrets.DF_NOTIFICATION_EMAILS }}
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$MODE" = "live-schedule" ]; then
            PYTHONPATH=src python -m df_scheduler.main
          elif [ "$MODE" = "test-email" ]; then
            PYTHONPATH=src python -m df_scheduler.main --test-email
          else
            PYTHONPATH=src python -m df_scheduler.main --dry-run
          fi
      - name: Commit audit history
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'live-schedule'
        run: |
          if git diff --quiet -- data; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/assignment_history.csv data/forecast_history.csv
          git commit -m "Record weekly DF schedule"
          git push
